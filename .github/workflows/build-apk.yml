name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build APK with Gradle
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STB-Remote-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Release Latest APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "STB Remote v1.1.0 (Live Dashboard & Transfer Progress)"
          body: |
            ## ✨ What's New in v1.1.0
            - 📡 **Live STB Health**: Temperature, RAM memory gauge, uptime, and real-time download/upload network speeds.
            - 📦 **Active Transfer Cards**: Native progress bars for active torrents, media grabs, and Google Drive uploads.
            - ⚡ **Auto-Refresh**: Live status syncs every 8 seconds via Telegram Bot API with zero battery waste.
            - 🎮 **Quick Actions**: One-tap Pause All, Resume All, and Cleanup.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
